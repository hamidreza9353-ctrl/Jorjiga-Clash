<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jorjiga Clash Admin</title><link rel="stylesheet" href="style.css"></head><body><main><section id="login"><h1>Jorjiga Clash</h1><p>پنل مدیریت</p><input id="user" placeholder="نام کاربری"><input id="pass" type="password" placeholder="رمز عبور"><button onclick="login()">ورود</button><p id="msg"></p></section><section id="dash" hidden><header><div><span>ADMIN PANEL</span><h1>داشبورد</h1></div><button onclick="logout()">خروج</button></header><div id="stats" class="stats"></div><div class="toolbar"><input id="search" placeholder="جستجو..." oninput="renderOrders()"><select id="filter" onchange="renderOrders()"><option value="">همه</option><option>pending</option><option>processing</option><option>completed</option><option>cancelled</option></select></div><div id="orders"></div></section></main><script src="app.js"></script></body></html>
